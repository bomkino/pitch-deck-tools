<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Type Boards · pitch.dog</title>
<style>
  :root {
    --bg: #08080b;
    --bg-grad-start: #11111a;
    --bg-grad-end: #08080b;
    --surface: #14141a;
    --surface-2: #1c1c24;
    --surface-3: #24242e;
    --border: #25252e;
    --border-strong: #34343f;
    --text: #f0f0f5;
    --text-dim: #8e8e9a;
    --text-faint: #50505a;
    --green: #30a46c;
    --red: #e5484d;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-grad-start) 0%, var(--bg-grad-end) 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection { background: rgba(48, 164, 108, 0.25); }

  .shell {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }

  /* Header */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 56px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px rgba(48, 164, 108, 0.55);
    animation: pulse 2.6s var(--ease) infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.9); }
  }
  .brand .dim { color: var(--text-dim); font-weight: 400; }
  .header-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }

  /* Project input */
  .project { margin-bottom: 36px; }
  .project label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .project input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-strong);
    color: var(--text);
    font-family: var(--sans);
    font-size: 32px;
    font-weight: 400;
    padding: 10px 0 18px;
    outline: none;
    letter-spacing: -0.02em;
    transition: border-bottom-color 0.2s var(--ease);
  }
  .project input:focus { border-bottom-color: var(--text); }
  .project input::placeholder { color: var(--text-faint); }

  /* Dropzone */
  .dropzone {
    display: block;
    margin-bottom: 36px;
    padding: 48px 24px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    text-align: center;
    cursor: pointer;
    transition: all 0.25s var(--ease);
    background: rgba(255, 255, 255, 0.005);
  }
  .dropzone:hover {
    border-color: var(--text-dim);
    background: var(--surface);
  }
  .dropzone.dragging {
    border-color: var(--green);
    background: rgba(48, 164, 108, 0.07);
    border-style: solid;
  }
  .dz-icon {
    width: 30px; height: 30px;
    margin: 0 auto 14px;
    color: var(--text-dim);
    transition: color 0.2s var(--ease), transform 0.25s var(--ease);
    display: block;
  }
  .dropzone:hover .dz-icon { color: var(--text); transform: translateY(-2px); }
  .dropzone .primary {
    font-size: 14px;
    margin-bottom: 4px;
    color: var(--text);
    font-weight: 500;
  }
  .dropzone .secondary {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  .dropzone input { display: none; }

  /* Stats */
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 12px;
  }
  .stats .counts { display: flex; gap: 22px; }
  .stats .pill {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-dim);
  }
  .stats .pill .num {
    color: var(--text);
    font-weight: 500;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .stats .bulk button {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 11px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    margin-left: 6px;
    transition: all 0.15s var(--ease);
  }
  .stats .bulk button:hover {
    color: var(--text);
    border-color: var(--text-dim);
    background: var(--surface-2);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 12px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    margin-bottom: 36px;
    letter-spacing: 0.03em;
  }

  /* Font grid */
  .font-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 36px;
  }
  @media (min-width: 880px) {
    .font-grid { grid-template-columns: 1fr 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: opacity 0.2s var(--ease), border-color 0.2s var(--ease),
                box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
    position: relative;
    animation: cardIn 0.4s var(--ease-out);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    border-color: var(--border-strong);
  }
  .card.rejected { opacity: 0.38; }
  .card.approved::after {
    content: "";
    position: absolute;
    top: 16px; right: 16px;
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(48, 164, 108, 0.5);
  }
  .card.dragging { opacity: 0.3; transform: scale(0.98); }
  .card.drop-target {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(48, 164, 108, 0.3);
  }

  .card-head {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
    font-family: var(--mono);
    font-size: 11px;
    padding-right: 14px;
  }
  .grip {
    display: inline-flex;
    align-items: center;
    color: var(--text-faint);
    cursor: grab;
    user-select: none;
    margin-right: 12px;
    padding: 4px 2px;
    border-radius: 3px;
    transition: color 0.15s var(--ease);
  }
  .grip:hover { color: var(--text-dim); }
  .grip:active { cursor: grabbing; }
  .grip svg { display: block; }
  .card-head .id {
    color: var(--text-dim);
    margin-right: 12px;
    font-variant-numeric: tabular-nums;
  }
  .card-head .name {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .card-head .controls { display: flex; gap: 4px; margin-left: 12px; }

  .seg {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .seg button {
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 10px;
    padding: 6px 9px;
    cursor: pointer;
    transition: color 0.15s var(--ease), background 0.15s var(--ease);
    letter-spacing: 0.02em;
  }
  .seg button + button { border-left: 1px solid var(--border-strong); }
  .seg button.active { color: var(--text); background: var(--surface-2); }
  .seg button:hover:not(.active) { color: var(--text-dim); }

  .preview {
    width: 100%;
    aspect-ratio: 1288 / 540;
    background: var(--bg);
    border-radius: var(--radius-sm);
    display: block;
    margin-bottom: 12px;
  }

  /* Variable axis controls */
  .axis-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 4px 14px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
  .axis-row .axis-tag {
    width: 36px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .axis-row input[type="range"] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border-strong);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .axis-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    background: var(--text-dim);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .axis-row input[type="range"]:hover::-webkit-slider-thumb,
  .axis-row input[type="range"]:active::-webkit-slider-thumb {
    background: var(--text);
    transform: scale(1.15);
  }
  .axis-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; background: var(--text-dim);
    border-radius: 50%; cursor: pointer; border: none;
    transition: background 0.15s var(--ease);
  }
  .axis-row input[type="range"]:hover::-moz-range-thumb { background: var(--text); }
  .axis-row .axis-value {
    width: 44px;
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* Card footer */
  .card-foot { display: flex; gap: 8px; }
  .card-foot button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s var(--ease);
  }
  .card-foot button:hover { color: var(--text); background: var(--surface-2); }
  .card-foot button.approve.active {
    color: var(--green);
    border-color: rgba(48, 164, 108, 0.4);
    background: rgba(48, 164, 108, 0.08);
  }
  .card-foot button.reject.active {
    color: var(--red);
    border-color: rgba(229, 72, 77, 0.4);
    background: rgba(229, 72, 77, 0.08);
  }

  /* Actions */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: 56px 0 32px;
  }
  .opts {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    transition: color 0.15s var(--ease);
  }
  .opts:hover { color: var(--text); }
  .opts input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    background: var(--surface);
    cursor: pointer;
    position: relative;
    transition: all 0.15s var(--ease);
    margin: 0;
  }
  .opts input[type="checkbox"]:checked {
    background: var(--text);
    border-color: var(--text);
  }
  .opts input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    top: -3px; left: 1px;
    color: var(--bg);
    font-size: 11px;
    font-weight: bold;
  }

  .btn-primary {
    background: var(--text);
    color: var(--bg);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 14px 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s var(--ease);
    letter-spacing: -0.01em;
  }
  .btn-primary:hover:not(:disabled) {
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(255,255,255,0.08);
  }
  .btn-primary:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Boards section */
  .boards {
    margin-top: 64px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }
  .boards-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
  }
  .boards h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    font-weight: 500;
    margin: 0;
  }
  .boards-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .boards-list { display: flex; flex-direction: column; gap: 18px; margin-bottom: 32px; }
  .board-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    animation: cardIn 0.4s var(--ease-out);
  }
  .board-wrap canvas {
    width: 100%; height: auto; display: block;
    border-radius: var(--radius-sm);
  }
  .board-wrap .label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-weight: 500;
  }
  .badge.index {
    background: rgba(48, 164, 108, 0.08);
    border-color: rgba(48, 164, 108, 0.3);
    color: var(--green);
  }

  /* Hover preview */
  .hover-preview {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s var(--ease), visibility 0.2s var(--ease);
    padding: 4vh 4vw;
  }
  .hover-preview.visible { opacity: 1; visibility: visible; }
  .hover-preview canvas {
    width: 92vw;
    max-width: 1700px;
    height: auto;
    border-radius: var(--radius);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
  }
  .hover-preview .meta-line {
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <h1 class="brand">
      <span class="brand-dot"></span>
      pitch.dog<span class="dim"> · type boards</span>
    </h1>
    <div class="header-meta">2576 × 1080</div>
  </header>

  <div class="project">
    <label for="projectInput">Project name</label>
    <input id="projectInput" type="text" placeholder="Your Headline" autocomplete="off" />
  </div>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".otf,.ttf" multiple />
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>
    </svg>
    <div class="primary">Drop font files</div>
    <div class="secondary">.otf or .ttf · click to browse</div>
  </label>

  <div id="statsBar" class="stats" style="display:none;">
    <div class="counts">
      <span class="pill"><span class="num" id="cTotal">0</span> total</span>
      <span class="pill"><span class="num" id="cApproved">0</span> approved</span>
      <span class="pill"><span class="num" id="cRejected">0</span> rejected</span>
    </div>
    <div class="bulk">
      <button id="bulkApprove">approve all</button>
      <button id="bulkReject">reject all</button>
      <button id="bulkClear">clear</button>
    </div>
  </div>

  <div id="emptyState" class="empty">No fonts loaded yet. Drop a few above to begin.</div>

  <div id="fontGrid" class="font-grid"></div>

  <div class="actions">
    <label class="opts">
      <input type="checkbox" id="includeIndex" checked />
      <span>Append index pages — 12 fonts per page, full list</span>
    </label>
    <button id="generateBtn" class="btn-primary" disabled>Generate boards</button>
  </div>

  <section id="boardsSection" class="boards" style="display:none;">
    <div class="boards-header">
      <h2>Generated</h2>
      <span class="boards-count" id="boardsCount"></span>
    </div>
    <div id="boardsList" class="boards-list"></div>
    <div style="text-align:center;">
      <button id="downloadAllBtn" class="btn-primary">Download all PNGs</button>
    </div>
  </section>

</div>

<!-- Hover-isolate overlay -->
<div id="hoverPreview" class="hover-preview">
  <canvas></canvas>
  <div class="meta-line"></div>
</div>

<script>
/* ====== STATE ====== */
const state = {
  projectName: "",
  fonts: [],  // { uid, file, family, url, casing, status, axes, axisValues }
  boards: [], // { canvas, index, type }
};
let draggedUid = null;
let hoverTimer = null;

/* ====== CONSTANTS ====== */
const BOARD_W = 2576;
const BOARD_H = 1080;
const QUAD_W = BOARD_W / 2;
const QUAD_H = BOARD_H / 2;
const MARGIN_RATIO = 0.10;
const REF_FONT_SIZE = 200;
const META_ALPHA_HEX = "55";
const HOVER_DELAY_MS = 350;
const DOWNLOAD_STAGGER_MS = 500;

const QUADRANT_PALETTE = [
  { text: "#30a46c", bg: "#121b17" },
  { text: "#e5484d", bg: "#201314" },
  { text: "#0090ff", bg: "#111927" },
  { text: "#f76b15", bg: "#1e160f" },
];
const QUADRANT_POSITIONS = [
  [0, 0], [QUAD_W, 0], [0, QUAD_H], [QUAD_W, QUAD_H],
];

// Index page constants
const INDEX_BG = "#0c0c0e";
const INDEX_TEXT = "#ebebed";
const INDEX_LABEL = "#74747e";
const INDEX_SEPARATOR = "rgba(255, 255, 255, 0.05)";
const INDEX_COLS = 4;
const INDEX_ROWS = 3;
const INDEX_PER_PAGE = INDEX_COLS * INDEX_ROWS; // 12

const AP_MINOR = new Set([
  "a","an","and","at","but","by","for","in","nor","of","on","or","so","the","to","up","yet"
]);

const MONO_STACK = `ui-monospace, "SF Mono", Menlo, Monaco, monospace`;

/* ====== fvar PARSER ====== */
/**
 * Parse the fvar table from a TTF/OTF buffer to detect variable axes.
 * Returns [{ tag, min, max, default }] or [] for non-variable / unparseable fonts.
 */
function parseVariableAxes(buffer) {
  try {
    const view = new DataView(buffer);
    if (buffer.byteLength < 12) return [];
    const numTables = view.getUint16(4);

    let fvarOffset = null;
    for (let i = 0; i < numTables; i++) {
      const recordOffset = 12 + i * 16;
      if (recordOffset + 16 > buffer.byteLength) break;
      const tag = String.fromCharCode(
        view.getUint8(recordOffset),
        view.getUint8(recordOffset + 1),
        view.getUint8(recordOffset + 2),
        view.getUint8(recordOffset + 3)
      );
      if (tag === 'fvar') {
        fvarOffset = view.getUint32(recordOffset + 8);
        break;
      }
    }
    if (fvarOffset === null) return [];

    const axesArrayOffset = view.getUint16(fvarOffset + 4);
    const axisCount = view.getUint16(fvarOffset + 8);
    const axisSize = view.getUint16(fvarOffset + 10);

    const axes = [];
    for (let i = 0; i < axisCount; i++) {
      const axisOffset = fvarOffset + axesArrayOffset + i * axisSize;
      const tag = String.fromCharCode(
        view.getUint8(axisOffset),
        view.getUint8(axisOffset + 1),
        view.getUint8(axisOffset + 2),
        view.getUint8(axisOffset + 3)
      );
      const min = view.getInt32(axisOffset + 4) / 65536;
      const def = view.getInt32(axisOffset + 8) / 65536;
      const max = view.getInt32(axisOffset + 12) / 65536;
      axes.push({ tag, min, max, default: def });
    }
    return axes;
  } catch (e) {
    console.warn("fvar parse error:", e);
    return [];
  }
}

/* ====== CASING ====== */
function capitalize(word) { return word.charAt(0).toUpperCase() + word.slice(1); }
function simpleTitleCase(text) { return text.toLowerCase().replace(/\b\p{L}/gu, c => c.toUpperCase()); }
function apTitleCase(text) {
  if (!text) return "";
  const tokens = text.split(/(\s+)/);
  const wordIndices = [];
  tokens.forEach((t, i) => { if (t.trim()) wordIndices.push(i); });
  if (wordIndices.length === 0) return text;
  const firstIdx = wordIndices[0];
  const lastIdx = wordIndices[wordIndices.length - 1];
  return tokens.map((tok, i) => {
    if (!tok.trim()) return tok;
    const lower = tok.toLowerCase();
    const isFirstOrLast = i === firstIdx || i === lastIdx;
    if (!isFirstOrLast && AP_MINOR.has(lower)) return lower;
    return capitalize(lower);
  }).join("");
}
function applyCasing(text, casing) {
  if (!text) return "";
  switch (casing) {
    case "upper": return text.toUpperCase();
    case "lower": return text.toLowerCase();
    case "title": return simpleTitleCase(text);
    case "ap":    return apTitleCase(text);
    default:      return text;
  }
}

/* ====== FONT LOADING ====== */
async function loadFont(file) {
  const buffer = await file.arrayBuffer();
  const url = URL.createObjectURL(file);
  const family = `tb-font-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  // Wide weight descriptor enables the wght axis on variable fonts via ctx.font weight prefix.
  const ff = new FontFace(family, `url(${url})`, { weight: "1 1000" });
  await ff.load();
  document.fonts.add(ff);

  const axes = parseVariableAxes(buffer);
  const axisValues = {};
  axes.forEach(a => { axisValues[a.tag] = a.default; });

  return {
    uid: crypto.randomUUID(),
    file: file.name,
    family,
    url,
    casing: "upper",
    status: "approved",
    axes,
    axisValues,
  };
}

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => /\.(otf|ttf)$/i.test(f.name));
  for (const f of files) {
    try {
      const font = await loadFont(f);
      state.fonts.push(font);
    } catch (err) {
      console.warn("Failed to load", f.name, err);
    }
  }
  render();
}

/* ====== AXIS HELPERS ====== */
function getAxis(font, tag) { return font.axes && font.axes.find(a => a.tag === tag); }
function hasAxis(font, tag) { return !!getAxis(font, tag); }

function fontString(font, size) {
  // Use weight prefix only when wght axis exists; otherwise let the browser use the
  // font's native weight (avoids fake-bold synthesis on static fonts).
  if (hasAxis(font, 'wght')) {
    const w = Math.round(font.axisValues.wght);
    return `${w} ${size}px "${font.family}"`;
  }
  return `${size}px "${font.family}"`;
}

/* ====== AUTO-SCALE MATH ====== */
function computeFit(ctx, text, font, maxW, maxH) {
  ctx.font = fontString(font, REF_FONT_SIZE);
  const m = ctx.measureText(text);
  const refW = m.width;
  const refH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  if (refW === 0 || refH === 0) return { size: 0, width: 0, ascent: 0, descent: 0 };
  const scale = Math.min(maxW / refW, maxH / refH);
  const size = REF_FONT_SIZE * scale;
  ctx.font = fontString(font, size);
  const final = ctx.measureText(text);
  return {
    size,
    width: final.width,
    ascent: final.actualBoundingBoxAscent,
    descent: final.actualBoundingBoxDescent,
  };
}

/* ====== HEADLINE BOARD RENDER ====== */
function renderQuadrant(ctx, x, y, w, h, text, font, palette, displayId) {
  ctx.fillStyle = palette.bg;
  ctx.fillRect(x, y, w, h);
  if (!text || !font) return;

  const marginX = w * MARGIN_RATIO;
  const marginY = h * MARGIN_RATIO;
  const innerW = w - 2 * marginX;
  const innerH = h - 2 * marginY;

  const fit = computeFit(ctx, text, font, innerW, innerH);
  if (fit.size === 0) return;

  ctx.font = fontString(font, fit.size);
  ctx.fillStyle = palette.text;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  const cx = x + w / 2;
  const cy = y + h / 2;
  const baselineY = cy + (fit.ascent - fit.descent) / 2;
  ctx.fillText(text, cx, baselineY);

  // Soft metadata corner
  const metaSize = Math.max(16, w * 0.014);
  ctx.font = `${metaSize}px ${MONO_STACK}`;
  ctx.fillStyle = palette.text + META_ALPHA_HEX;
  ctx.textAlign = "left";
  ctx.textBaseline = "bottom";
  const wghtSuffix = hasAxis(font, 'wght') ? ` · wght ${Math.round(font.axisValues.wght)}` : "";
  const metaPadX = w * 0.025;
  const metaPadY = h * 0.045;
  ctx.fillText(`${displayId} · ${font.file}${wghtSuffix}`, x + metaPadX, y + h - metaPadY);
}

function renderBoard(canvas, group, displayIds) {
  canvas.width = BOARD_W;
  canvas.height = BOARD_H;
  const ctx = canvas.getContext("2d");
  ctx.textRendering = "geometricPrecision";

  for (let i = 0; i < 4; i++) {
    const [qx, qy] = QUADRANT_POSITIONS[i];
    const font = group[i];
    const text = font ? applyCasing(state.projectName || "Your Headline", font.casing) : "";
    const id = displayIds && displayIds[i] ? displayIds[i] : "";
    renderQuadrant(ctx, qx, qy, QUAD_W, QUAD_H, text, font, QUADRANT_PALETTE[i], id);
  }
}

/* ====== INDEX BOARD RENDER ====== */
function renderIndexCell(ctx, x, y, w, h, font, displayId) {
  const marginX = w * 0.08;
  const marginY = h * 0.14;
  const labelH = h * 0.13;
  const innerW = w - 2 * marginX;

  // Label
  const labelSize = Math.max(15, h * 0.058);
  ctx.font = `${labelSize}px ${MONO_STACK}`;
  ctx.fillStyle = INDEX_LABEL;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  let labelText = `${displayId} · ${font.file}`;
  if (hasAxis(font, 'wght')) labelText += ` · wght ${Math.round(font.axisValues.wght)}`;
  // Truncate label if too wide
  if (ctx.measureText(labelText).width > innerW) {
    while (labelText.length > 12 && ctx.measureText(labelText + "…").width > innerW) {
      labelText = labelText.slice(0, -1);
    }
    labelText += "…";
  }
  ctx.fillText(labelText, x + marginX, y + marginY);

  // Sample text area
  const textY = y + marginY + labelH + h * 0.04;
  const textH = h - (textY - y) - marginY;
  if (textH < 20) return;

  const text = applyCasing(state.projectName || "Your Headline", font.casing);
  if (!text) return;

  const fit = computeFit(ctx, text, font, innerW, textH);
  if (fit.size === 0) return;

  ctx.font = fontString(font, fit.size);
  ctx.fillStyle = INDEX_TEXT;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const cx = x + w / 2;
  const cy = textY + textH / 2;
  const baselineY = cy + (fit.ascent - fit.descent) / 2;
  ctx.fillText(text, cx, baselineY);
}

function renderIndexBoard(canvas, entries, pageInfo) {
  canvas.width = BOARD_W;
  canvas.height = BOARD_H;
  const ctx = canvas.getContext("2d");
  ctx.textRendering = "geometricPrecision";

  ctx.fillStyle = INDEX_BG;
  ctx.fillRect(0, 0, BOARD_W, BOARD_H);

  const cellW = BOARD_W / INDEX_COLS;
  const cellH = BOARD_H / INDEX_ROWS;

  // Separator lines
  ctx.strokeStyle = INDEX_SEPARATOR;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 1; c < INDEX_COLS; c++) {
    ctx.moveTo(c * cellW, 0);
    ctx.lineTo(c * cellW, BOARD_H);
  }
  for (let r = 1; r < INDEX_ROWS; r++) {
    ctx.moveTo(0, r * cellH);
    ctx.lineTo(BOARD_W, r * cellH);
  }
  ctx.stroke();

  entries.forEach((entry, i) => {
    const col = i % INDEX_COLS;
    const row = Math.floor(i / INDEX_COLS);
    renderIndexCell(ctx, col * cellW, row * cellH, cellW, cellH, entry.font, entry.displayId);
  });

  // Page indicator — bottom-right corner
  const indSize = 18;
  ctx.font = `${indSize}px ${MONO_STACK}`;
  ctx.fillStyle = INDEX_LABEL + "aa";
  ctx.textAlign = "right";
  ctx.textBaseline = "bottom";
  const projDisplay = pageInfo.projectName || "untitled";
  ctx.fillText(`Index · ${pageInfo.current} / ${pageInfo.total} · ${projDisplay}`, BOARD_W - 32, BOARD_H - 24);
}

/* ====== CARD PREVIEW RENDER ====== */
function renderCardPreview(canvas, font) {
  const W = canvas.width;
  const H = canvas.height;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0a0a0c";
  ctx.fillRect(0, 0, W, H);

  const text = applyCasing(state.projectName || "Your Headline", font.casing);
  if (!text) return;

  const marginX = W * MARGIN_RATIO;
  const marginY = H * MARGIN_RATIO;
  const innerW = W - 2 * marginX;
  const innerH = H - 2 * marginY;

  const fit = computeFit(ctx, text, font, innerW, innerH);
  if (fit.size === 0) return;

  ctx.font = fontString(font, fit.size);
  ctx.fillStyle = "#ebebed";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const cx = W / 2;
  const cy = H / 2;
  const baselineY = cy + (fit.ascent - fit.descent) / 2;
  ctx.fillText(text, cx, baselineY);
}

/* ====== DRAG ====== */
function attachDragHandlers(card, grip, font) {
  card.draggable = false;
  grip.addEventListener("mousedown", () => { card.draggable = true; });
  grip.addEventListener("mouseup",   () => { card.draggable = false; });

  card.addEventListener("dragstart", e => {
    if (!card.draggable) { e.preventDefault(); return; }
    draggedUid = font.uid;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", font.uid);
    hideHoverPreview();
  });
  card.addEventListener("dragend", () => {
    draggedUid = null;
    card.draggable = false;
    document.querySelectorAll(".card").forEach(c => {
      c.classList.remove("dragging");
      c.classList.remove("drop-target");
    });
  });
  card.addEventListener("dragover", e => {
    if (!draggedUid || draggedUid === font.uid) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    card.classList.add("drop-target");
  });
  card.addEventListener("dragleave", () => card.classList.remove("drop-target"));
  card.addEventListener("drop", e => {
    e.preventDefault();
    card.classList.remove("drop-target");
    if (!draggedUid || draggedUid === font.uid) return;
    const fromIdx = state.fonts.findIndex(f => f.uid === draggedUid);
    const toIdx   = state.fonts.findIndex(f => f.uid === font.uid);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = state.fonts.splice(fromIdx, 1);
    const adjustedTo = fromIdx < toIdx ? toIdx - 1 : toIdx;
    state.fonts.splice(adjustedTo, 0, moved);
    draggedUid = null;
    render();
  });
}

/* ====== HOVER PREVIEW ====== */
function showHoverPreview(font, displayId) {
  if (draggedUid) return;
  renderBoard(hoverCanvas, [font, font, font, font], [displayId, displayId, displayId, displayId]);
  const wghtSuffix = hasAxis(font, 'wght') ? ` · wght ${Math.round(font.axisValues.wght)}` : "";
  hoverMeta.textContent = `${displayId} · ${font.file}${wghtSuffix}`;
  hoverPreview.classList.add("visible");
}
function hideHoverPreview() {
  clearTimeout(hoverTimer);
  hoverPreview.classList.remove("visible");
}
function attachHoverHandlers(card, font, displayId) {
  card.addEventListener("mouseenter", () => {
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => showHoverPreview(font, displayId), HOVER_DELAY_MS);
  });
  card.addEventListener("mouseleave", hideHoverPreview);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") hideHoverPreview(); });

/* ====== UI RENDER ====== */
function render() {
  const total = state.fonts.length;
  const approved = state.fonts.filter(f => f.status === "approved").length;
  const rejected = state.fonts.filter(f => f.status === "rejected").length;
  cTotal.textContent = total;
  cApproved.textContent = approved;
  cRejected.textContent = rejected;
  statsBar.style.display = total ? "flex" : "none";
  emptyState.style.display = total ? "none" : "block";
  generateBtn.disabled = approved === 0;

  fontGrid.innerHTML = "";
  state.fonts.forEach((font, i) => {
    const displayId = String(i + 1).padStart(2, "0");
    const wghtAxis = getAxis(font, 'wght');

    const card = document.createElement("div");
    card.className = "card " + font.status;
    card.innerHTML = `
      <div class="card-head">
        <span class="grip" title="Drag to reorder">
          <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor" aria-hidden="true">
            <circle cx="3" cy="3" r="1"/><circle cx="7" cy="3" r="1"/>
            <circle cx="3" cy="7" r="1"/><circle cx="7" cy="7" r="1"/>
            <circle cx="3" cy="11" r="1"/><circle cx="7" cy="11" r="1"/>
          </svg>
        </span>
        <div class="id">${displayId}</div>
        <div class="name" title="${font.file}">${font.file}</div>
        <div class="controls">
          <div class="seg" data-casing>
            <button data-c="upper" class="${font.casing === "upper" ? "active" : ""}" title="Uppercase">AA</button>
            <button data-c="lower" class="${font.casing === "lower" ? "active" : ""}" title="Lowercase">aa</button>
            <button data-c="title" class="${font.casing === "title" ? "active" : ""}" title="Title case">Aa</button>
            <button data-c="ap"    class="${font.casing === "ap"    ? "active" : ""}" title="AP-style title case">AP</button>
          </div>
        </div>
      </div>
      <canvas class="preview" width="1288" height="540"></canvas>
      ${wghtAxis ? `
        <div class="axis-row" data-axis="wght">
          <span class="axis-tag">wght</span>
          <input type="range"
                 min="${wghtAxis.min}" max="${wghtAxis.max}" step="1"
                 value="${Math.round(font.axisValues.wght)}" />
          <span class="axis-value">${Math.round(font.axisValues.wght)}</span>
        </div>
      ` : ""}
      <div class="card-foot">
        <button class="reject ${font.status === "rejected" ? "active" : ""}" data-action="reject">Reject</button>
        <button class="approve ${font.status === "approved" ? "active" : ""}" data-action="approve">Approve</button>
      </div>
    `;
    fontGrid.appendChild(card);

    const grip = card.querySelector(".grip");
    const previewCanvas = card.querySelector("canvas.preview");

    // Casing
    card.querySelectorAll("[data-casing] button").forEach(btn => {
      btn.addEventListener("click", () => { font.casing = btn.dataset.c; render(); });
    });

    // Approve/Reject
    card.querySelectorAll(".card-foot button").forEach(btn => {
      btn.addEventListener("click", () => {
        font.status = btn.dataset.action === "approve" ? "approved" : "rejected";
        render();
      });
    });

    // wght slider — live update without re-rendering the whole grid
    if (wghtAxis) {
      const slider = card.querySelector('.axis-row input[type="range"]');
      const valueLabel = card.querySelector('.axis-row .axis-value');
      slider.addEventListener("input", () => {
        font.axisValues.wght = parseInt(slider.value, 10);
        valueLabel.textContent = font.axisValues.wght;
        renderCardPreview(previewCanvas, font);
      });
    }

    attachDragHandlers(card, grip, font);
    attachHoverHandlers(card, font, displayId);

    requestAnimationFrame(() => renderCardPreview(previewCanvas, font));
  });
}

/* ====== BOARD WRAP BUILDER ====== */
function makeBoardWrap(type, indexNum, ids, total) {
  const wrap = document.createElement("div");
  wrap.className = "board-wrap";

  const canvas = document.createElement("canvas");
  wrap.appendChild(canvas);

  const label = document.createElement("div");
  label.className = "label";

  const badgeClass = type === 'index' ? 'badge index' : 'badge';
  const badgeText = type === 'index' ? 'INDEX' : 'BOARD';
  const titleText = type === 'index'
    ? `Page ${indexNum}${total ? ` of ${total}` : ''} · ${ids.length} fonts`
    : `Board ${String(indexNum).padStart(2, "0")} · ${ids.join(" · ")}`;

  label.innerHTML = `
    <span><span class="${badgeClass}">${badgeText}</span>${titleText}</span>
    <span>2576 × 1080</span>
  `;
  wrap.appendChild(label);
  boardsList.appendChild(wrap);
  return { wrap, canvas };
}

/* ====== GENERATE ====== */
generateBtn.addEventListener("click", async () => {
  await document.fonts.ready;

  const approved = state.fonts
    .map((f, i) => ({ font: f, displayId: String(i + 1).padStart(2, "0") }))
    .filter(x => x.font.status === "approved");

  if (!approved.length) return;

  state.boards = [];
  boardsList.innerHTML = "";

  // Headline boards — 4 per
  const headlineGroups = [];
  for (let i = 0; i < approved.length; i += 4) headlineGroups.push(approved.slice(i, i + 4));

  headlineGroups.forEach((group, idx) => {
    const fonts = group.map(g => g.font);
    const ids = group.map(g => g.displayId);
    const { canvas } = makeBoardWrap('board', idx + 1, ids);
    renderBoard(canvas, fonts, ids);
    state.boards.push({ canvas, index: idx + 1, type: 'board' });
  });

  // Index pages — 12 per, if enabled
  if (includeIndex.checked) {
    const pages = [];
    for (let i = 0; i < approved.length; i += INDEX_PER_PAGE) pages.push(approved.slice(i, i + INDEX_PER_PAGE));
    pages.forEach((page, idx) => {
      const ids = page.map(p => p.displayId);
      const { canvas } = makeBoardWrap('index', idx + 1, ids, pages.length);
      renderIndexBoard(canvas, page, {
        current: idx + 1,
        total: pages.length,
        projectName: state.projectName,
      });
      state.boards.push({ canvas, index: idx + 1, type: 'index' });
    });
  }

  boardsCount.textContent = `${state.boards.length} board${state.boards.length === 1 ? '' : 's'}`;
  boardsSection.style.display = "block";
  boardsSection.scrollIntoView({ behavior: "smooth", block: "start" });
});

/* ====== DOWNLOAD ALL ====== */
function slug(s) {
  return (s || "untitled").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
}

downloadAllBtn.addEventListener("click", () => {
  const projectSlug = slug(state.projectName);
  state.boards.forEach((b, i) => {
    setTimeout(() => {
      b.canvas.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const prefix = b.type === 'index' ? 'index' : 'board';
        a.download = `typeboard-${projectSlug}-${prefix}-${String(b.index).padStart(2, "0")}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }, "image/png");
    }, i * DOWNLOAD_STAGGER_MS);
  });
});

/* ====== INIT ====== */
render();
